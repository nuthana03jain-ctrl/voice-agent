<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Sales Call Simulator</title>
<style>
  /* ============================================================
     1. LOOK & FEEL (colors, phone frame, buttons, chat bubbles)
     ============================================================ */
  :root {
    --bg: #0f172a;
    --phone: #111827;
    --screen-top: #1e293b;
    --screen-bottom: #0b1120;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --green: #22c55e;
    --red: #ef4444;
    --agent-bubble: #334155;
    --me-bubble: #2563eb;
    --warn-bg: #fef3c7;
    --warn-text: #78350f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e3a8a 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* The phone frame. On small screens it fills the whole screen. */
  .phone {
    width: 100%;
    max-width: 390px;
    height: min(820px, calc(100vh - 32px));
    background: var(--phone);
    border-radius: 44px;
    padding: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #374151;
  }
  .screen {
    height: 100%;
    border-radius: 34px;
    background: linear-gradient(180deg, var(--screen-top), var(--screen-bottom));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  @media (max-width: 480px) {
    body { padding: 0; }
    .phone { max-width: none; height: 100vh; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
  }

  /* Top area: avatar, name, status, timer */
  .caller {
    text-align: center;
    padding: 36px 20px 16px;
    flex-shrink: 0;
  }
  .avatar {
    width: 88px; height: 88px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    display: grid; place-items: center;
    font-size: 34px; font-weight: 700;
    position: relative;
  }
  /* Pulsing ring around the avatar while ringing / talking */
  .avatar::after {
    content: ""; position: absolute; inset: -6px;
    border-radius: 50%; border: 3px solid transparent;
  }
  .screen.ringing .avatar::after { border-color: var(--green); animation: pulse 1s infinite; }
  .screen.speaking .avatar::after { border-color: #a5b4fc; animation: pulse .8s infinite; }
  .screen.listening .avatar::after { border-color: var(--green); }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  .caller h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .status { color: var(--muted); font-size: 14px; min-height: 20px; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 15px; margin-top: 4px; color: var(--green);
    visibility: hidden;
  }
  .screen.connected .timer { visibility: visible; }

  /* Warning banner when speech recognition is not supported */
  .warning {
    display: none;
    margin: 0 16px 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 13px;
    line-height: 1.4;
  }
  .warning.show { display: block; }

  /* Live transcript (chat bubbles) */
  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .empty-hint {
    margin: auto; text-align: center; color: var(--muted);
    font-size: 14px; max-width: 240px; line-height: 1.5;
  }
  .bubble {
    max-width: 80%;
    padding: 9px 13px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.35;
    word-wrap: break-word;
    animation: pop .15s ease-out;
  }
  .bubble small { display: block; font-size: 11px; opacity: .7; margin-bottom: 2px; }
  .bubble.agent { align-self: flex-start; background: var(--agent-bubble); border-bottom-left-radius: 4px; }
  .bubble.me    { align-self: flex-end;   background: var(--me-bubble);   border-bottom-right-radius: 4px; }
  .bubble.interim { opacity: .55; font-style: italic; }
  .bubble.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; padding: 2px; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Type-instead box (handy for testing, or if the mic doesn't work) */
  .typebox {
    display: none;
    gap: 8px;
    padding: 8px 16px 0;
  }
  .screen.connected .typebox { display: flex; }
  .typebox input {
    flex: 1; min-width: 0;
    border: none; border-radius: 20px;
    padding: 10px 14px; font-size: 15px;
    background: #1f2937; color: var(--text);
  }
  .typebox button {
    border: none; border-radius: 20px; padding: 0 14px;
    background: var(--me-bubble); color: white; font-size: 14px; cursor: pointer;
  }

  /* Bottom: the big round Call / Hang up buttons */
  .controls {
    flex-shrink: 0;
    padding: 18px 20px 30px;
    display: flex;
    justify-content: center;
  }
  .round-btn {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: none;
    color: white;
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    transition: transform .1s, filter .2s;
  }
  .round-btn:active { transform: scale(.93); }
  .round-btn:hover { filter: brightness(1.1); }
  .round-btn svg { width: 32px; height: 32px; fill: currentColor; }
  .call-btn { background: var(--green); }
  .hangup-btn { background: var(--red); display: none; }
  .hangup-btn svg { transform: rotate(135deg); }
  .btn-label { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .screen.in-call .call-wrap { display: none; }
  .screen.in-call .hangup-btn { display: grid; }
</style>
</head>
<body>

<!-- ============================================================
     2. THE CALL SCREEN (HTML structure)
     ============================================================ -->
<div class="phone">
  <div class="screen" id="screen">
    <div class="caller">
      <div class="avatar">AI</div>
      <h1>Aapi · Claura Company</h1>
      <div class="status" id="status">Ready to call</div>
      <div class="timer" id="timer">00:00</div>
    </div>

    <div class="warning" id="warning"></div>

    <div class="transcript" id="transcript">
      <div class="empty-hint" id="emptyHint">
        Press the green button to start a practice sales call.<br />
        Allow microphone access when your browser asks.
      </div>
    </div>

    <form class="typebox" id="typebox" autocomplete="off">
      <input id="typeInput" placeholder="Or type a reply…" />
      <button type="submit">Send</button>
    </form>

    <div class="controls">
      <div class="call-wrap">
        <button class="round-btn call-btn" id="callBtn" aria-label="Call">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>
        </button>
        <div class="btn-label">Call</div>
      </div>
      <div>
        <button class="round-btn hangup-btn" id="hangupBtn" aria-label="Hang up">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   3. SETUP: grab page elements and check browser support
   ============================================================ */
const screen      = document.getElementById("screen");
const statusEl    = document.getElementById("status");
const timerEl     = document.getElementById("timer");
const transcript  = document.getElementById("transcript");
const emptyHint   = document.getElementById("emptyHint");
const warningEl   = document.getElementById("warning");
const callBtn     = document.getElementById("callBtn");
const hangupBtn   = document.getElementById("hangupBtn");
const typebox     = document.getElementById("typebox");
const typeInput   = document.getElementById("typeInput");

// Chrome and Edge call it "webkitSpeechRecognition". Firefox doesn't have it.
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = !!SpeechRecognition;
const canSpeak  = "speechSynthesis" in window;

if (!canListen) {
  showWarning(
    "<b>Speech recognition isn't supported in this browser.</b> " +
    "It works best in <b>Google Chrome</b> (or Edge) on desktop or Android. " +
    "You can still try the call by typing your replies."
  );
}
if (!canSpeak) {
  showWarning("<b>Your browser can't speak out loud.</b> The agent's replies will only appear as text.");
}

function showWarning(html) {
  warningEl.innerHTML += (warningEl.innerHTML ? "<br><br>" : "") + html;
  warningEl.classList.add("show");
}

/* Call state */
let inCall = false;
let timerId = null;
let seconds = 0;
let ringer = null;        // the ringing sound
let recognition = null;   // the speech recognizer
let interimBubble = null; // faded bubble showing words as you speak
let stage = "intro";      // where we are in the conversation

/* ============================================================
   4. RINGING SOUND (made with the Web Audio API — no files needed)
   A real phone ring is two tones (440 Hz + 480 Hz) played together.
   ============================================================ */
function playRinging(rings, onDone) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) { onDone(); return; }
  const ctx = new AudioCtx();
  const volume = ctx.createGain();
  volume.gain.value = 0;
  volume.connect(ctx.destination);

  [440, 480].forEach(freq => {
    const osc = ctx.createOscillator();
    osc.frequency.value = freq;
    osc.connect(volume);
    osc.start();
  });

  // Each ring: 1.2s of sound, then 0.8s of silence.
  const ringOn = 1.2, ringOff = 0.8;
  const start = ctx.currentTime + 0.05;
  for (let i = 0; i < rings; i++) {
    const t = start + i * (ringOn + ringOff);
    volume.gain.setValueAtTime(0.15, t);
    volume.gain.setValueAtTime(0, t + ringOn);
  }

  const total = rings * (ringOn + ringOff) * 1000;
  const doneTimer = setTimeout(() => { ctx.close(); onDone(); }, total);

  // Return a "stop" function so Hang up can cut the ringing short.
  return { stop() { clearTimeout(doneTimer); ctx.close(); } };
}

/* ============================================================
   5. CALL CONTROLS: start call, connect, timer, hang up
   ============================================================ */
callBtn.addEventListener("click", startCall);
hangupBtn.addEventListener("click", () => endCall("You hung up"));

function startCall() {
  inCall = true;
  stage = "intro";
  transcript.innerHTML = "";
  screen.classList.add("in-call", "ringing");
  setStatus("Calling…");
  ringer = playRinging(2, connectCall);
}

function connectCall() {
  if (!inCall) return;
  ringer = null;
  screen.classList.remove("ringing");
  screen.classList.add("connected");
  setStatus("Connected");
  startTimer();
  addSystemNote("Call connected");
  agentSay("Hi, this is an aapi AI assistant calling from claura Company. Is this a good time to talk?");
}

function endCall(reason) {
  if (!inCall) return;
  inCall = false;
  if (ringer) { ringer.stop(); ringer = null; }
  stopListening();
  if (canSpeak) speechSynthesis.cancel();
  stopTimer();
  addSystemNote(reason + " · " + timerEl.textContent);
  screen.classList.remove("in-call", "ringing", "connected", "speaking", "listening");
  setStatus("Call ended");
}

function startTimer() {
  seconds = 0;
  timerEl.textContent = "00:00";
  timerId = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    timerEl.textContent = m + ":" + s;
  }, 1000);
}
function stopTimer() { clearInterval(timerId); timerId = null; }

function setStatus(text) { statusEl.textContent = text; }

/* ============================================================
   6. SPEECH SYNTHESIS — the agent talks back
   ============================================================ */
let currentUtterance = null; // keep a reference (fixes a Chrome bug where "onend" never fires)

function agentSay(text, afterSpeaking) {
  addBubble("agent", text);
  stopListening(); // don't listen while the agent talks, or it hears itself

  const next = afterSpeaking || startListening;

  if (!canSpeak) { next(); return; }

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 1;
  u.pitch = 1;
  const voice = pickVoice();
  if (voice) u.voice = voice;

  u.onstart = () => { screen.classList.add("speaking"); setStatus("Agent is speaking…"); };
  u.onend = u.onerror = () => {
    screen.classList.remove("speaking");
    if (currentUtterance === u && inCall) next();
  };
  currentUtterance = u;
  speechSynthesis.speak(u);
}

// Try to choose a nice English voice. Voices load a moment after the page opens.
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /Google US English|Samantha|Microsoft (Aria|Jenny)/i.test(v.name))
      || voices.find(v => v.lang === "en-US")
      || voices.find(v => v.lang && v.lang.startsWith("en"))
      || null;
}
if (canSpeak) speechSynthesis.onvoiceschanged = pickVoice;

/* ============================================================
   7. SPEECH RECOGNITION — the agent hears you
   We listen for one sentence at a time:
   agent speaks → we listen → you finish talking → agent replies → repeat
   ============================================================ */
function startListening() {
  if (!inCall) return;
  if (!canListen) { setStatus("Type your reply below"); return; }

  const rec = new SpeechRecognition();
  recognition = rec;
  recognition.lang = "en-US";
  recognition.interimResults = true;  // show words while you're still talking
  recognition.continuous = false;     // stop after one sentence
  recognition.maxAlternatives = 1;

  let finalText = "";

  recognition.onstart = () => {
    screen.classList.add("listening");
    setStatus("Listening… speak now");
  };

  recognition.onresult = (event) => {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const piece = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += piece;
      else interim += piece;
    }
    if (interim) showInterim(interim);
  };

  recognition.onerror = (event) => {
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      showWarning("<b>Microphone blocked.</b> Click the 🔒 / camera icon in the address bar, allow the microphone, then call again. You can also type your replies.");
      if (recognition === rec) recognition = null;
      setStatus("Mic blocked — type your reply");
    }
    // "no-speech" and "aborted" are normal; onend handles them.
  };

  recognition.onend = () => {
    screen.classList.remove("listening");
    const heard = finalText.trim();
    const wasActive = recognition === rec; // false if we stopped it on purpose
    if (wasActive) recognition = null;
    clearInterim();
    if (!inCall || !wasActive) return;

    if (heard) handleUserText(heard);
    else startListening(); // heard nothing — keep listening
  };

  try { rec.start(); } catch (e) { /* already started */ }
}

function stopListening() {
  if (recognition) {
    const r = recognition;
    recognition = null;  // tells onend not to restart
    r.abort();
  }
  screen.classList.remove("listening");
  clearInterim();
}

// The typing box works the same way as speaking.
typebox.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = typeInput.value.trim();
  if (!text || !inCall) return;
  typeInput.value = "";
  stopListening();
  if (canSpeak) speechSynthesis.cancel();
  handleUserText(text);
});

/* ============================================================
   8. REPLY RULES — simple "if you hear X, say Y"
   ============================================================ */
function handleUserText(text) {
  addBubble("me", text);
  const said = text.toLowerCase();
  const has = (...words) => words.some(w => new RegExp("\\b" + w + "\\b").test(said));

  // Rule 1: goodbye ends the call
  if (has("bye", "goodbye", "good bye", "hang up", "not interested", "stop calling")) {
    agentSay("No problem. Thank you for your time, and have a great day. Goodbye!",
             () => endCall("Agent ended the call"));
    return;
  }

  // Rule 2: price questions
  if (has("price", "prices", "cost", "costs", "fee", "fees", "how much", "expensive", "pay")) {
    stage = "pitched";
    agentSay("Great question! The full course is just 4,999 rupees, and this week there's a 20 percent early-bird discount. Would you like me to send you the details?");
    return;
  }

  // Rule 3: questions about the course itself
  if (has("course", "what is it", "details", "what do you", "learn", "about")) {
    stage = "pitched";
    agentSay("It's an 8-week online course on AI and digital skills, with live classes, recorded lessons and a certificate. Would you like to know the price?");
    return;
  }

  // Rule 4: how long / schedule
  if (has("how long", "duration", "weeks", "schedule", "when")) {
    agentSay("The course runs for 8 weeks, with classes on weekends, so it fits around work or college. Shall I tell you about the price?");
    return;
  }

  // Rule 5: "no" — answer depends on what we just asked
  if (has("no", "nope", "not now", "busy", "later")) {
    if (stage === "intro") {
      agentSay("I understand. I'll call you back at a better time. Thank you, goodbye!",
               () => endCall("Agent ended the call"));
    } else {
      agentSay("That's okay. Is there anything else you'd like to know about the course, like the price or the schedule?");
    }
    return;
  }

  // Rule 6: "yes" — answer depends on what we just asked
  if (has("yes", "yeah", "yep", "sure", "okay", "ok", "of course", "go ahead", "please")) {
    if (stage === "intro") {
      stage = "pitched";
      agentSay("Wonderful! We have a new online course that teaches practical AI skills in just 8 weeks. Would you like to hear about the price?");
    } else {
      stage = "closing";
      agentSay("Perfect! I'll send the course details and enrollment link to your phone right after this call. Is there anything else I can help with?");
    }
    return;
  }

  // Rule 7: greetings
  if (has("hi", "hello", "hey")) {
    agentSay("Hello! Thanks for picking up. Is this a good time to talk for a minute?");
    return;
  }

  // Fallback: we didn't understand
  agentSay("Sorry, I didn't quite catch that. You can ask me about the course, the price, or say bye to end the call.");
}

/* ============================================================
   9. TRANSCRIPT HELPERS — add chat bubbles
   ============================================================ */
function addBubble(who, text) {
  clearInterim();
  const div = document.createElement("div");
  div.className = "bubble " + who;
  div.innerHTML = "<small>" + (who === "agent" ? "Agent" : "You") + "</small>";
  div.appendChild(document.createTextNode(text));
  transcript.appendChild(div);
  scrollDown();
}

function addSystemNote(text) {
  const div = document.createElement("div");
  div.className = "bubble system";
  div.textContent = text;
  transcript.appendChild(div);
  scrollDown();
}

function showInterim(text) {
  if (!interimBubble) {
    interimBubble = document.createElement("div");
    interimBubble.className = "bubble me interim";
    transcript.appendChild(interimBubble);
  }
  interimBubble.textContent = text + "…";
  scrollDown();
}
function clearInterim() {
  if (interimBubble) { interimBubble.remove(); interimBubble = null; }
}

function scrollDown() { transcript.scrollTop = transcript.scrollHeight; }
</script>
</body>
</html>
